<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오산 찐 맛집 큐레이션</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 화려한 오로라 백그라운드 애니메이션 헤더 */
        header {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: white;
            text-align: center;
            padding: 4rem 1rem 3rem 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 0.8rem;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            letter-spacing: -1px;
            animation: fadeInDown 1s ease;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 300;
            animation: fadeInUp 1s ease;
        }

        .container {
            max-width: 1240px;
            margin: -2rem auto 3rem auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }

        /* 검색창 애니메이션 디자인 */
        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            border-radius: 50px;
            overflow: hidden;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(35, 166, 213, 0.4);
            border-color: #23a6d5;
        }

        .search-box input {
            width: 100%;
            max-width: 600px;
            padding: 1.2rem 1.8rem;
            font-size: 1.1rem;
            border: none;
            outline: none;
            background: transparent;
            color: #fff;
        }

        .search-box input::placeholder {
            color: #94a3b8;
        }

        .search-box button {
            padding: 0 2rem;
            background: linear-gradient(135deg, #23a6d5, #23d5ab);
            color: white;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        /* 그리드 & 카드 3D 모션 디자인 */
        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .card {
            background: #1e293b;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 20px 40px rgba(35, 213, 171, 0.25);
            border-color: rgba(35, 213, 171, 0.5);
        }

        .img-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover img {
            transform: scale(1.1);
        }

        .card-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f1f5f9;
        }

        .card-category {
            font-size: 0.8rem;
            background: linear-gradient(135deg, rgba(35, 166, 213, 0.2), rgba(35, 213, 171, 0.2));
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 1.2rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #cbd5e1;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 1rem;
        }

        .rating {
            color: #fbbf24;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 모달 팝업 애니메이션 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #1e293b;
            color: #f8fafc;
            width: 100%;
            max-width: 650px;
            border-radius: 24px;
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.8rem;
        }

        .info-row {
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
            color: #cbd5e1;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .info-row strong {
            color: #38bdf8;
            min-width: 80px;
        }

        .modal-section-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
            color: #38bdf8;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-list {
            list-style: none;
            margin-bottom: 1.2rem;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            font-size: 1rem;
            color: #cbd5e1;
        }

        .review-box {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 1.2rem;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 공유 및 외부 링크 액션 영역 */
        .action-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: linear-gradient(135deg, rgba(35, 166, 213, 0.1), rgba(35, 213, 171, 0.1));
            border-radius: 16px;
            border: 1px solid rgba(35, 213, 171, 0.3);
        }

        .email-input-group {
            display: flex;
            gap: 8px;
            margin-top: 0.8rem;
        }

        .email-input-group input {
            flex-grow: 1;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #0f172a;
            color: white;
            outline: none;
        }

        .email-input-group input:focus {
            border-color: #38bdf8;
        }

        .btn-action {
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            text-decoration: none;
            justify-content: center;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn-primary:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .btn-site {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            margin-top: 0.8rem;
            width: 100%;
            font-size: 1rem;
        }

        .btn-site:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background: #334155;
            color: white;
            margin-top: 0.6rem;
            width: 100%;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        footer {
            text-align: center;
            padding: 3rem;
            color: #64748b;
            font-size: 0.95rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                    { name: "김치말이국수", price: "6,000원" }
                ],
                review: "갈매기살의 육즙이 살아있으며 사이드로 나오는 시원한 김치말이국수와의 궁합이 환상적."
            },
            {
                id: 10,
                name: "북극해고등어 (본점)",
                category: "생선구이/한식",
                desc: "대형 화덕에서 겉은 바삭하고 속은 촉촉하게 구워내는 생선구이 정식.",
                hours: "11:00 - 21:00 (라스트오더 20:15)",
                rating: 4.8,
                location: "경기 오산시 경기동로 131",
                image: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=600&auto=format&fit=crop&q=80",
                menus: [
                    { name: "화덕 고등어구이 정식", price: "14,000원" },
                    { name: "화덕 삼치구이 정식", price: "16,000원" }
                ],
                review: "비린내가 전혀 없고 담백하며 무한 리필 셀프 바의 정갈한 밑반찬들도 훌륭함."
            }
        ];

        function displayRestaurants(list) {
            const grid = document.getElementById('restaurantGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 3rem;">검색 결과가 없습니다 🥲</p>`;
                return;
            }

            list.forEach((resto, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animation = `fadeInUp 0.5s ease ${index * 0.05}s both`;
                card.onclick = () => openModal(resto);
                card.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${resto.image}" alt="${resto.name}">
                    </div>
                    <div class="card-content">
                        <div class="card-title">
                            <span>${resto.name}</span>
                            <span class="card-category">${resto.category}</span>
                        </div>
                        <p class="card-desc">${resto.desc}</p>
                        <div class="card-footer">
                            <span>📍 ${resto.location.split(',')[0]}</span>
                            <span class="rating">★ ${resto.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(resto) {
            document.getElementById('modalTitle').innerText = resto.name;
            
            let menuHtml = '';
            resto.menus.forEach(menu => {
                menuHtml += `<li class="menu-item"><span>${menu.name}</span><strong>${menu.price}</strong></li>`;
            });

            // 지도 사이트 연결 URL 생성
            const mapSearchUrl = `https://map.naver.com/v5/search/${encodeURIComponent(resto.name + ' ' + resto.location)}`;

            const bodyHtml = `
                <p style="color: #94a3b8; margin-bottom: 1.2rem; font-size: 1rem;">${resto.desc}</p>
                
                <div class="info-row"><strong>📍 위치:</strong> <span>${resto.location}</span></div>
                <div class="info-row"><strong>⏰ 영업시간:</strong> <span>${resto.hours}</span></div>
                
                <div class="modal-section-title">📜 주요 메뉴</div>
                <ul class="menu-list">${menuHtml}</ul>
                
                <div class="modal-section-title">💡 방문 요약 평</div>
                <div class="review-box">${resto.review}</div>

                <!-- 외부 연결 및 복사/메일 액션 영역 -->
                <div class="action-box">
                    <a href="${mapSearchUrl}" target="_blank" class="btn-action btn-site">
                        🗺️ 지도 / 사이트로 바로 이동하기 ➔
                    </a>

                    <button class="btn-action btn-secondary" onclick="copyRestoInfo('${resto.name}', '${resto.location}', '${resto.hours}', '${mapSearchUrl}')">
                        🔗 식당 정보 클립보드 복사
                    </button>

                    <div style="margin-top: 1.2rem; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 1rem;">
                        <div style="font-weight: bold; font-size: 0.95rem; color: #38bdf8;">✉️ 정보 메일로 보내기</div>
                        <div class="email-input-group">
                            <input type="email" id="targetEmail" placeholder="수신자 이메일 주소 입력">
                            <button class="btn-action btn-primary" onclick="sendMailDirect('${resto.name}', '${resto.location}', '${resto.hours}', '${mapSearchUrl}')">전송</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modalBody').innerHTML = bodyHtml;
            const modal = document.getElementById('detailModal');
            modal.classList.add('show');
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.remove('show');
        }

        // 1. 이메일 전송 기능
        function sendMailDirect(name, location, hours, mapUrl) {
            const emailInput = document.getElementById('targetEmail').value.trim();
            const subject = encodeURIComponent(`[오산 맛집 추천] ${name} 정보`);
            const body = encodeURIComponent(
                `안녕하세요!\n\n오산 맛집 [ ${name} ] 정보를 공유합니다.\n\n` +
                `📍 위치: ${location}\n` +
                `⏰ 영업시간: ${hours}\n` +
                `🗺️ 지도 보기: ${mapUrl}\n\n` +
                `맛있는 식사 되세요!`
            );

            const mailtoLink = `mailto:${emailInput}?subject=${subject}&body=${body}`;
            window.location.href = mailtoLink;

            if(emailInput) {
                alert(`${emailInput} 주소로 이메일 작성 창이 연결되었습니다.`);
            } else {
                alert(`이메일 프로그램이 열렸습니다.`);
            }
        }

        // 2. 클립보드 복사 기능
        function copyRestoInfo(name, location, hours, mapUrl) {
            const textToCopy = `[오산 맛집] ${name}\n위치: ${location}\n영업시간: ${hours}\n지도링크: ${mapUrl}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(`'${name}' 정보가 클립보드에 복사되었습니다! 원하는 곳에 붙여넣어 공유하세요.`);
            }).catch(err => {
                alert('복사 중 오류가 발생했습니다.');
            });
        }

        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function searchRestaurant() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = restaurants.filter(resto => 
                resto.name.toLowerCase().includes(keyword) || 
                resto.category.toLowerCase().includes(keyword) ||
                resto.desc.toLowerCase().includes(keyword) ||
                resto.location.toLowerCase().includes(keyword)
            );
            displayRestaurants(filtered);
        }

        displayRestaurants(restaurants);
    </script>
</body>
</html>
