<html lang="ko">
<head>

            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
        }

        header {
            padding: 4.5rem 1.5rem 3rem 1.5rem;
            text-align: center;
            position: relative;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(11, 15, 25, 0) 100%);
        }

        header .badge-top {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
        }

        header p {
            font-size: 1.05rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto 4rem auto;
            padding: 0 1.5rem;
        }

        .search-box-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 640px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 0.5rem 0.5rem 0.5rem 1.5rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
            transform: translateY(-2px);
        }

        .search-box input {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            color: #fff;
            font-size: 1.05rem;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        .search-box button {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .search-box button:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .restaurant-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .img-wrapper {
            width: 100%;
            height: 190px;
            overflow: hidden;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.08);
        }

        .card-content {
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .card-category {
            font-size: 0.75rem;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 1.2rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 0.8rem;
        }

        .rating {
            color: #fbbf24;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #1e293b;
            color: #f8fafc;
            width: 100%;
            max-width: 600px;
            border-radius: 28px;
            overflow: hidden;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform: scale(0.92);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

            padding: 1.8rem 2rem 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .modal-body {
            padding: 2rem;
        }

        .info-row {
            margin-bottom: 0.7rem;
            font-size: 0.95rem;
            color: #cbd5e1;
            display: flex;
            gap: 10px;
        }

        .info-row strong {
            color: #38bdf8;
            min-width: 80px;
        }

        .modal-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 1.8rem;
            margin-bottom: 0.8rem;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-list {
            list-style: none;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .menu-item:last-child {

        }

            background: rgba(15, 23, 42, 0.5);
            padding: 1.2rem;
            border-radius: 16px;
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .action-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(56, 189, 248, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.15);

            width: 100%;
            padding: 0.9rem;
            border-radius: 14px;
            border: none;

            font-size: 0.95rem;
            cursor: pointer;

            align-items: center;
            justify-content: center;
            gap: 8px;

            margin-top: 0.6rem;

            background: rgba(255, 255, 255, 0.15);

        }

            gap: 8px;
            margin-top: 0.8rem;
        }

            flex-grow: 1;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 0.9rem;
        }

            border-color: #38bdf8;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
            padding: 0 1.2rem;
            white-space: nowrap;
        }

            padding: 3rem;
            color: #475569;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        let currentSelectedResto = null;

        function displayRestaurants(list) {
            const grid = document.getElementById('restaurantGrid');
            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 4rem;">검색 결과가 없습니다 🥲</p>`;
                return;
            }

            list.forEach((resto, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animation = `fadeInUp 0.3s ease ${Math.min(index * 0.03, 0.6)}s both`;
                card.onclick = () => openModal(resto);
                card.innerHTML = `
                    <div class="img-wrapper">
                        <img src="${resto.image}" alt="${resto.name}">
                    </div>
                    <div class="card-content">
                        <div class="card-header-row">
                            <span class="card-title">${resto.name}</span>
                            <span class="card-category">${resto.category}</span>
                        </div>
                        <p class="card-desc">${resto.desc}</p>
                        <div class="card-footer">
                            <span>📍 ${resto.location.split(',')[0]}</span>
                            <span class="rating">★ ${resto.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function goToMap(restoName) {
            const keyword = "오산 " + restoName;
            const mapUrl = "https://map.naver.com/p/search/" + encodeURIComponent(keyword);
            window.open(mapUrl, '_blank');
        }

        function openModal(resto) {
            currentSelectedResto = resto;
            document.getElementById('modalTitle').innerText = resto.name;
            
            let menuHtml = '';
            resto.menus.forEach(menu => {
                menuHtml += `<li class="menu-item"><span>${menu.name}</span><strong>${menu.price}</strong></li>`;
            });

            const bodyHtml = `
                <p style="color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5;">${resto.desc}</p>
                
                <div class="info-row"><strong>📍 위치</strong> <span>${resto.location}</span></div>
                <div class="info-row"><strong>⏰ 영업시간</strong> <span>${resto.hours}</span></div>
                
                <div class="modal-section-title">📜 주요 메뉴</div>
                <ul class="menu-list">${menuHtml}</ul>
                
                <div class="modal-section-title">💡 방문 요약 평</div>
                <div class="review-box">${resto.review}</div>

                <div class="action-box">
                    <button class="btn-action btn-site" onclick="goToMap('${resto.name}')">
                        🗺️ 지도에서 '오산 ${resto.name}' 검색하기 ➔
                    </button>

                    <button class="btn-action btn-secondary" onclick="copyCurrentInfo()">
                        🔗 식당 정보 클립보드 복사
                    </button>

                    <div style="margin-top: 1.2rem; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 1rem;">
                        <div style="font-weight: 600; font-size: 0.9rem; color: #38bdf8; margin-bottom: 0.4rem;">✉️ 정보 이메일로 발송</div>
                        <div class="email-input-group">
                            <input type="email" id="targetEmail" placeholder="수신자 이메일 주소">
                            <button class="btn-action btn-primary" onclick="sendMailCurrent()">보내기</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('modalBody').innerHTML = bodyHtml;
            const modal = document.getElementById('detailModal');
            modal.classList.add('show');
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.remove('show');
        }

        function sendMailCurrent() {
            if (!currentSelectedResto) return;
            const resto = currentSelectedResto;
            const keyword = "오산 " + resto.name;
            const mapUrl = "https://map.naver.com/p/search/" + encodeURIComponent(keyword);

            const emailInput = document.getElementById('targetEmail').value.trim();
            const subject = encodeURIComponent(`[오산 맛집 추천] ${resto.name} 정보`);
            const body = encodeURIComponent(
                `안녕하세요!\n\n오산 맛집 [ ${resto.name} ] 정보를 공유합니다.\n\n` +
                `📍 위치: ${resto.location}\n` +
                `⏰ 영업시간: ${resto.hours}\n` +
                `🗺️ 지도 검색: ${mapUrl}\n\n` +
                `맛있는 식사 되세요!`
            );

            window.location.href = `mailto:${emailInput}?subject=${subject}&body=${body}`;

            if (emailInput) {
                alert(`${emailInput} 주소로 이메일 클라이언트가 연결되었습니다.`);
            } else {
                alert(`이메일 프로그램이 열렸습니다.`);
            }
        }

        function copyCurrentInfo() {
            if (!currentSelectedResto) return;
            const resto = currentSelectedResto;
            const keyword = "오산 " + resto.name;
            const mapUrl = "https://map.naver.com/p/search/" + encodeURIComponent(keyword);

            const textToCopy = `[오산 맛집] ${resto.name}\n위치: ${resto.location}\n영업시간: ${resto.hours}\n지도링크: ${mapUrl}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert(`'${resto.name}' 정보가 클립보드에 복사되었습니다!`);
            }).catch(() => {
                alert('복사 중 오류가 발생했습니다.');
            });
        }

        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function searchRestaurant() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = restaurants.filter(resto => 
                resto.name.toLowerCase().includes(keyword) || 
                resto.category.toLowerCase().includes(keyword) ||
                resto.desc.toLowerCase().includes(keyword) ||
                resto.location.toLowerCase().includes(keyword)
            );
            displayRestaurants(filtered);
        }

        displayRestaurants(restaurants);
    </script>
</body>
</html>
